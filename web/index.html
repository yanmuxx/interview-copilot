<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面试 Copilot</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e8ebf2; --dim:#8b93a5;
          --blue:#4f8cff; --amber:#f5b544; --green:#3ecf8e; --red:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  .brand { font-weight:700; font-size:15px; }
  select, input[type=text], input[type=password], textarea {
    background:#0c0e12; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--blue); }
  button { border:none; border-radius:8px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .primary { background:var(--blue); color:#fff; }
  .primary.stop { background:var(--red); }
  .ghost { background:#222734; color:var(--txt); width:100%; }
  .ghost:hover { background:#2a3040; }
  .pill { padding:3px 12px; border-radius:99px; font-size:12px; background:#222734; color:var(--dim); }
  .pill.on { background:rgba(62,207,142,.15); color:var(--green); }
  .wrap { flex:1; display:flex; min-height:0; }
  aside { width:330px; border-right:1px solid var(--line); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; background:#12151b; }
  aside section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  aside h2 { font-size:13px; color:var(--dim); font-weight:600; }
  aside label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); }
  aside textarea { resize:vertical; }
  .msg { font-size:12px; color:var(--amber); min-height:16px; }
  main { flex:1; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:14px; }
  .empty { margin:auto; color:var(--dim); text-align:center; }
  .qa { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .qa .q { color:var(--blue); font-weight:600; margin-bottom:6px; }
  .qa .q .secs { color:var(--dim); font-weight:400; font-size:12px; margin-left:8px; }
  .qa .a { color:var(--amber); white-space:pre-wrap; }
  .qa .a .cursor { display:inline-block; width:8px; height:14px; background:var(--amber); vertical-align:-2px; animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .notice { color:var(--red); font-size:13px; }
  .sys { color:var(--dim); font-size:12px; text-align:center; }
  input[type=file] { color:var(--dim); font-size:12px; }
  #personaTa { min-height:220px; font-size:12.5px; }
</style>
</head>
<body>
<header>
  <span class="brand">🎤 面试 Copilot</span>
  <select id="mode">
    <option value="brief">简明要点（快）</option>
    <option value="full">完整回答（慢）</option>
  </select>
  <span style="flex:1"></span>
  <button id="overlayBtn" class="ghost" style="width:auto;padding:7px 14px">📌 悬浮窗</button>
  <span id="status" class="pill">未启动</span>
  <button id="toggle" class="primary">开始面试</button>
</header>

<div class="wrap">
  <aside>
    <section>
      <h2>LLM 设置</h2>
      <label>API Key <input id="apiKey" type="password" placeholder="sk-...（已保存则可留空）"></label>
      <label>接口地址 <input id="baseUrl" type="text"></label>
      <label>模型 <input id="model" type="text"></label>
      <button id="saveCfg" class="ghost">保存设置</button>
      <div id="cfgMsg" class="msg"></div>
    </section>

    <section>
      <h2>简历 → 画像</h2>
      <input id="file" type="file" accept=".pdf,.docx,.txt,.md">
      <label>岗位 JD（可选）<textarea id="jd" rows="3" placeholder="粘贴目标岗位的 JD，画像会更贴合"></textarea></label>
      <button id="parseBtn" class="ghost">解析简历 → 自动生成画像</button>
      <div id="parseMsg" class="msg"></div>
    </section>

    <section>
      <h2>候选人画像（可编辑）</h2>
      <textarea id="personaTa" rows="14"></textarea>
      <button id="savePersona" class="ghost">保存画像</button>
    </section>
  </aside>

  <main id="feed">
    <div class="empty" id="emptyHint">点击右上角「开始面试」，然后播放面试音频（会议软件 / 视频）<br>面试官的提问和 AI 答案会实时出现在这里</div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const feed = $("#feed");
let es = null, running = false;

// ---------- 初始化 ----------
(async function init() {
  const cfg = await (await fetch("/api/config")).json();
  $("#baseUrl").value = cfg.base_url; $("#model").value = cfg.model;
  $("#apiKey").placeholder = cfg.has_key ? "已保存（留空即沿用）" : "sk-...";
  $("#personaTa").value = (await (await fetch("/api/persona")).json()).persona;
  const st = await (await fetch("/api/interview/state")).json();
  if (st.running) { running = true; setUI(); openSSE(); replayHistory(); }
})();

function replayHistory() {
  fetch("/api/interview/history").then(r => r.json()).then(({events}) =>
    events.forEach(ev => handle(ev, true)));
}

// ---------- 配置 / 简历 / 画像 ----------
$("#saveCfg").onclick = async () => {
  const fd = new FormData();
  fd.append("api_key", $("#apiKey").value);
  fd.append("base_url", $("#baseUrl").value);
  fd.append("model", $("#model").value);
  const r = await fetch("/api/config", {method:"POST", body:fd});
  const d = await r.json();
  $("#cfgMsg").textContent = d.ok ? "已保存 ✔" : "保存失败";
  if (d.has_key) $("#apiKey").placeholder = "已保存（留空即沿用）";
  setTimeout(() => $("#cfgMsg").textContent = "", 3000);
};

$("#parseBtn").onclick = async () => {
  const btn = $("#parseBtn"), msg = $("#parseMsg");
  if (!$("#file").files.length) { msg.textContent = "请先选择简历文件"; return; }
  btn.disabled = true; msg.textContent = "解析中，约几秒 ...";
  const fd = new FormData();
  fd.append("file", $("#file").files[0]);
  fd.append("jd", $("#jd").value);
  try {
    const r = await fetch("/api/resume/parse", {method:"POST", body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "解析失败");
    $("#personaTa").value = d.persona; msg.textContent = "生成完毕，可修改后点「保存画像」";
  } catch (e) { msg.textContent = e.message; }
  btn.disabled = false;
};

$("#savePersona").onclick = async () => {
  const fd = new FormData(); fd.append("persona", $("#personaTa").value);
  await fetch("/api/persona", {method:"POST", body:fd});
  $("#parseMsg").textContent = "画像已保存 ✔";
  setTimeout(() => $("#parseMsg").textContent = "", 3000);
};

// ---------- 面试控制 ----------
$("#toggle").onclick = () => running ? doStop() : doStart();
$("#overlayBtn").onclick = async () => {
  if (window.pywebview?.api?.toggle_overlay) await window.pywebview.api.toggle_overlay();
  else sysLine("⚠ 悬浮窗需要用桌面程序启动（python app.py），浏览器模式不可用");
};

async function doStart() {
  const btn = $("#toggle");
  btn.disabled = true;
  const fd = new FormData(); fd.append("mode", $("#mode").value);
  let d;
  try {
    const r = await fetch("/api/interview/start", {method:"POST", body:fd});
    d = await r.json();
    if (!r.ok) { sysLine("⚠ " + flattenDetail(d.detail)); return; }
    if (d.aborted) return;
  } catch (e) { sysLine("⚠ 启动请求失败：服务可能没在运行"); return; }
  finally { btn.disabled = false; }
  running = true; setUI();
  feed.innerHTML = ""; openSSE();
  if (!d.has_llm) sysLine("⚠ 未配置 API Key，只显示面试官的问题，不出答案");
}
function flattenDetail(x) { return Array.isArray(x) ? x.map(i => i.msg || JSON.stringify(i)).join("; ") : x; }
async function doStop() {
  await fetch("/api/interview/stop", {method:"POST"});
}

function setUI() {
  const btn = $("#toggle"), pill = $("#status");
  btn.textContent = running ? "停止" : "开始面试";
  btn.classList.toggle("stop", running);
  pill.textContent = running ? "监听中" : "未启动";
  pill.classList.toggle("on", running);
}

function openSSE() {
  if (es) es.close();
  es = new EventSource("/api/interview/events");
  es.onmessage = m => { const ev = JSON.parse(m.data); handle(ev, false);
    if (ev.type === "status" && ev.state === "stopped") { running = false; setUI(); es.close(); } };
  es.onerror = () => { if (!running) es.close(); };
}

// ---------- 事件渲染 ----------
let curAnswer = null;
function handle(ev, replay) {
  if (ev.type === "transcript") {
    hideEmpty();
    const qa = document.createElement("div");
    qa.className = "qa";
    qa.innerHTML = `<div class="q">🎤 ${esc(ev.text)}<span class="secs">转写 ${ev.secs}s</span></div><div class="a"></div>`;
    feed.appendChild(qa);
    curAnswer = qa.querySelector(".a");
  } else if (ev.type === "answer_delta") {
    if (!curAnswer) return;
    if (!curAnswer.querySelector(".cursor")) curAnswer.appendChild(cursorEl());
    curAnswer.insertBefore(document.createTextNode(ev.delta), curAnswer.querySelector(".cursor"));
  } else if (ev.type === "answer_done") {
    if (curAnswer) curAnswer.querySelector(".cursor")?.remove();
    curAnswer = null;
  } else if (ev.type === "status" && ev.state === "listening") {
    if (ev.hint) sysLine("ℹ " + ev.hint);
  } else if (ev.type === "error") {
    if (curAnswer) { curAnswer.querySelector(".cursor")?.remove(); curAnswer = null; }
    sysLine("⚠ " + esc(ev.message));
  }
  if (!replay) feed.scrollTop = feed.scrollHeight;
}
function cursorEl() { const c = document.createElement("span"); c.className = "cursor"; return c; }
function sysLine(text) {
  hideEmpty();
  const d = document.createElement("div");
  d.className = text.startsWith("⚠") ? "notice" : "sys";
  d.textContent = text;
  feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
}
function hideEmpty() { $("#emptyHint")?.remove(); }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
</script>
</body>
</html>
