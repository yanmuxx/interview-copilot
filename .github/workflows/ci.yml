name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（基础 + 测试，无 GPU 库）
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest -q

      - name: 构建便携包（CPU 版，模型不内置）
        run: python build_portable.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: portable-cpu
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14
